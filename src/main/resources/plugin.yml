name: AwakeningCutscene
version: 1.0.0
main: com.awakening.AwakeningPlugin
api-version: '1.21'
depend: [Citizens]
description: Cutscene awakening megah (freecam NPC Citizens, partikel, blok melayang)
commands:
  awakening:
    description: Jalankan cutscene awakening
    usage: /awakening <beast|dragon|elf|human> <player>
    permission: awakening.use
permissions:
  awakening.use:
    description: Boleh pakai /awakening
    default: op
